# Driven by docker/fa, which resolves every variable below and passes
# --project-directory. Running `docker compose` here by hand works too, but then
# PROJECT_ROOT has to be set yourself.
name: ${COMPOSE_PROJECT_NAME:-frontaccounting}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION:-7.4}"
        INSTALL_XDEBUG: "${INSTALL_XDEBUG:-true}"
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      FA_TIMEZONE: "${FA_TIMEZONE:-UTC}"
      # Read by docker/fa inside the container; also handy in a shell.
      FA_DB_HOST: db
      FA_DB_NAME: "${DB_NAME:-fa_test}"
      FA_DB_USER: "${DB_USER:-fa}"
      FA_DB_PASSWORD: "${DB_PASSWORD:-fa}"
      FA_DB_PREFIX: "${DB_PREFIX:-0_}"
    volumes:
      # The checkout itself. FrontAccounting is served from where it is edited,
      # so a change is live on the next request with no sync step.
      - ${PROJECT_ROOT:?set PROJECT_ROOT or use docker/fa}:/var/www/html
    ports:
      - "${HTTP_PORT:-8080}:80"

  db:
    image: mariadb:${MARIADB_VERSION:-10.11}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-fa}"
      MYSQL_DATABASE: "${DB_NAME:-fa_test}"
      MYSQL_USER: "${DB_USER:-fa}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-fa}"
    volumes:
      - db-data:/var/lib/mysql
      # Runs once, on an empty data volume only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      # app waits on this: mariadb's entrypoint starts the server twice, and
      # connecting during the first, bootstrap pass gets a connection that dies.
      # Probing over TCP rather than the socket is what tells the two apart —
      # the bootstrap server runs with --skip-networking.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Opt-in: `docker/fa up --with-tools`, or `docker compose --profile tools up`.
  phpmyadmin:
    image: phpmyadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: "${DB_USER:-fa}"
      PMA_PASSWORD: "${DB_PASSWORD:-fa}"
      UPLOAD_LIMIT: 128M
    ports:
      - "${PMA_PORT:-8081}:80"

volumes:
  db-data:
