name: Deploy scripts

# deploy/test/run.sh: the release, upload, resolve and sql-changes scripts,
# with local fixtures and no network.

on:
  push:
    branches: [master-cp, master-ark]
    paths:
      - deploy/**
      - upload-exclude.txt
      - makefile.json
      - .github/workflows/deploy-test.yml
  pull_request:
    paths:
      - deploy/**
      - upload-exclude.txt
      - makefile.json
      - .github/workflows/deploy-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: deploy/test/run.sh

  # bms runs Debian trixie, whose rrsync (rsync 3.4+) reports a missing file
  # differently from Ubuntu's.
  upload-trixie:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 10
    steps:
      - name: Install rsync
        run: apt-get update -qq && apt-get install -y -qq rsync python3
      - uses: actions/checkout@v7
      - name: Test
        run: bash deploy/test/upload.sh
