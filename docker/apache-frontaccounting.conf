# The checkout's own .htaccess denies direct fetches of .inc/.sql/.log files and
# turns off directory listings. Debian's default vhost sets AllowOverride None
# for /var/www, which would silently discard all of that and serve the source
# of every *_db.inc in the tree, so the override has to be allowed back on.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nothing under these is ever fetched over HTTP, and several hold credentials,
# database dumps or a whole second checkout.
<DirectoryMatch "/var/www/html/(\.git|docker|node_modules|install/lang)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(config\.php|config_db\.php|installed_extensions\.php)$">
    Require all denied
</FilesMatch>

# Company data: attachments and backups are private. images/ (item photos, the
# company logo) and js_cache/ are not — includes/page/header.inc emits
# <script src="company/<n>/js_cache/...">, so denying that directory would
# strip the JavaScript from every page.
<DirectoryMatch "/var/www/html/company/[^/]+/(backup|attachments)">
    Require all denied
</DirectoryMatch>

ServerName localhost
