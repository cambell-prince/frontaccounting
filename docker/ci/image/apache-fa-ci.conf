# FrontAccounting's .htaccess needs AllowOverride; Debian's default vhost turns
# it off for /var/www.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<FilesMatch "^(config\.php|config_db\.php|installed_extensions\.php)$">
    Require all denied
</FilesMatch>

# Bearer tokens (graphql): mod_php does not always see the Authorization header.
SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

ServerName localhost
