; PHP settings for the FrontAccounting test stack.
; Development values — do not copy these onto a live server.

memory_limit = 256M
max_execution_time = 120

; Report and attachment uploads, and the backup/restore pages, move files of a
; size the stock 2M limit rejects.
upload_max_filesize = 32M
post_max_size = 32M

; config.php sets a default when this is empty, but leaving it unset makes every
; date call emit a warning first.
date.timezone = ${FA_TIMEZONE}

; FrontAccounting has its own on-page debug output ($go_debug in config.php);
; these make PHP's own notices visible in the same place rather than silently
; logged.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Whether the extension is loaded at all is decided by the entrypoint, which
; runs phpdismod/phpenmod from XDEBUG_MODE — see docker/docker-entrypoint.sh for
; why it has to be off rather than merely idle. These settings sit in a zz- file
; so they are read after the package's own 20-xdebug.ini and win.
xdebug.mode = ${XDEBUG_MODE}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
